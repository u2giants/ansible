name: apply

# The SINGLE, SERIALIZED production apply point (plan §5). Merging to main does NOT apply:
# production runs only by manual dispatch from main, after `ai-task-gates check --before
# production` passes on that exact clean main HEAD with an exact-head AI reviewer APPROVE
# (docs/deployment.md). GATED: the real apply only runs when ENABLE_AUTO_APPLY == 'true'.
# The default-off toolkit maintenance role still requires its exact manual tag.

on:
  workflow_dispatch:
    inputs:
      tags:
        description: "Ansible tags to run (default phase1)"
        default: "phase1"

# THE serialization guarantee: queue, never run two applies simultaneously (§5.1).
concurrency:
  group: apply-hetzner
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: production    # add required reviewers here for a manual approval gate
    steps:
      - name: Refuse a dispatch from any ref but main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Production applies dispatch only from main (got $GITHUB_REF)"
          exit 1
      - uses: actions/checkout@v4
      - name: Refuse an ambiguous toolkit maintenance dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          DEPLOY_TAGS: ${{ github.event.inputs.tags }}
        run: |
          if [[ "$DEPLOY_TAGS" == *ai_devops_toolkit* && "$DEPLOY_TAGS" != "ai_devops_toolkit" ]]; then
            echo "::error::Run the toolkit maintenance tag by itself: tags=ai_devops_toolkit"
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ansible-core
      - run: ansible-galaxy collection install -r requirements.yml
      - name: Test recoverable AI DevOps toolkit cutover
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.tags == 'ai_devops_toolkit'
        run: bash tests/test-ai-devops-toolkit.sh

      - name: Connect to Tailscale (ephemeral tag:ci)
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          SSH_PRIVATE_KEY: op://vibe_coding/ci-deploy-ssh/private_key
          CLOUDFLARED_TUNNEL_TOKEN: op://vibe_coding/cf-tunnel-hetz/password

      # Toolkit-only: the hetz `ai` service-account token install.sh uses to restore
      # reviewer keys. Scoped so a bad reference cannot break routine phase1 applies.
      - name: Load toolkit reviewer-key token from 1Password
        id: toolkit_token
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.tags == 'ai_devops_toolkit'
        uses: 1password/load-secrets-action@v2
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          AI_DEVOPS_OP_SA_TOKEN: op://vibe_coding/yw6o7cwwqn5n6zqliddu5d3w4m/OP_SERVICE_ACCOUNT_TOKEN

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null && echo "ssh key OK" || { echo "SSH KEY INVALID"; exit 1; }

      # --- GATE: apply for real only when explicitly enabled (plan §9, Phase 4) ---
      - name: Apply (REAL) — phase1 only, serialized
        if: vars.ENABLE_AUTO_APPLY == 'true'
        env:
          DEPLOY_TAGS: ${{ github.event.inputs.tags || 'phase1' }}
          AI_DEVOPS_OP_SA_TOKEN: ${{ steps.toolkit_token.outputs.AI_DEVOPS_OP_SA_TOKEN }}
        run: |
          tags="$DEPLOY_TAGS"
          extra=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$tags" = "ai_devops_toolkit" ]; then
            extra=(-e enable_ai_devops_toolkit_deploy=true)
          fi
          ansible-playbook playbooks/site.yml -l hetzner --tags "$tags" "${extra[@]}"

      - name: Auto-apply disabled — dry run only
        if: vars.ENABLE_AUTO_APPLY != 'true'
        run: |
          echo "::notice::ENABLE_AUTO_APPLY is not 'true' — running --check only (plan §9)."
          ansible-playbook playbooks/site.yml -l hetzner --tags phase1 --check --diff
