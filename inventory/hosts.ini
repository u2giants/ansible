# Inventory. One host in scope today; designed to scale to N (plan §2).
# NOTE: in INI [group:vars], inline "# comments" after a value become PART of the value.
# Keep comments on their own lines only — never after `key=value`.

[hetzner]
# Tailscale IP is the preferred path (CI joins the tailnet). Public IP fallback: 178.156.180.212
hetz ansible_host=100.66.37.58

[hetzner:vars]
ansible_user=ai
ansible_python_interpreter=/usr/bin/python3

# --- Throwaway scratch host: prove risky roles here BEFORE prod (plan §8.3, §9) ---
# Stand up a cheap Hetzner/DO box, set its IP, and run with `-e target_hosts=scratch`.
[scratch]
# scratch1 ansible_host=CHANGE_ME ansible_user=root

[scratch:vars]
ansible_python_interpreter=/usr/bin/python3

# --- DigitalOcean backup-wizard droplet: folded in later (plan §2.3) ---
[do_backup_wiz]
# backup-wiz ansible_host=CHANGE_ME ansible_user=root

# Developer computers are deliberately opt-in. Add only Tailscale addresses.
# Windows OpenSSH must already be bootstrapped once; see docs/dev-computers.md.
[windows_dev]
# Run from WSL/Ubuntu. Single quotes preserve the domain-name backslash; the
# private key path is on the Ansible control node, not the Windows target.
# 4837 ansible_host=100.123.87.44 ansible_user='IML\ahazan2' ansible_ssh_private_key_file=~/.ssh/916-alien

[windows_dev:vars]
ansible_connection=ssh
ansible_shell_type=powershell

[ubuntu_dev]
# t16-wsl ansible_host=100.x.y.z ansible_user=ahazan2 ansible_ssh_private_key_file=~/.ssh/916-alien
vps2 ansible_host=100.66.37.58 ansible_user=ai

[dev_computers:children]
windows_dev
ubuntu_dev

[all:vars]
ansible_ssh_common_args=-o StrictHostKeyChecking=accept-new
