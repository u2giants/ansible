---
# firewall — manage ONLY the host-owned SSH lockdown in the filter INPUT chain, declaratively
# (ansible.builtin.iptables). Leave Docker (nat / DOCKER*), Tailscale (ts-input), and fail2ban
# (f2b-*) chains alone — those daemons own and continuously rebuild them. This avoids the daily
# drift the old full-`iptables-save` capture caused (Docker rewrites its nat chains every time a
# container cycles). Read roles/firewall/README.md before editing.
#
# Model (matches live hetz): INPUT policy stays ACCEPT (default-allow). The ONLY restriction is
# SSH — port 22 is allowed from trusted sources and dropped from everyone else; the public SSH
# alt-port(s) (1904) stay open for the `ai` account. Defense-in-depth with `ssh_hardening`, which
# restricts WHO may log in from where. Applying this is a no-op on IPv4 (rules already exist) and
# adds the matching IPv6 lockdown (currently missing).

- name: Ensure fail2ban is enabled and running
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started

- name: Ensure iptables rule persistence is enabled
  ansible.builtin.systemd:
    name: netfilter-persistent
    enabled: true

- name: Allow public SSH alt-ports (kept open to the internet for the ai account)
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_port: "{{ item }}"
    jump: ACCEPT
  loop: "{{ firewall_ssh_public_ports }}"
  notify: Persist iptables

- name: Allow SSH from trusted IPv4 sources
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_port: "{{ firewall_ssh_port }}"
    source: "{{ item }}"
    jump: ACCEPT
  loop: "{{ firewall_ssh_trusted_v4 }}"
  notify: Persist iptables

- name: Drop SSH from everyone else (IPv4)
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_port: "{{ firewall_ssh_port }}"
    jump: DROP
  notify: Persist iptables

# --- IPv6: close the same gap (live v6 INPUT has NO port-22 restriction). ssh_hardening still
#     gates WHO may log in, so this is defense-in-depth. ---
- name: Allow SSH from trusted IPv6 sources
  ansible.builtin.iptables:
    chain: INPUT
    ip_version: ipv6
    protocol: tcp
    destination_port: "{{ firewall_ssh_port }}"
    source: "{{ item }}"
    jump: ACCEPT
  loop: "{{ firewall_ssh_trusted_v6 }}"
  when: firewall_lock_ipv6 | bool
  notify: Persist iptables

- name: Drop SSH from everyone else (IPv6)
  ansible.builtin.iptables:
    chain: INPUT
    ip_version: ipv6
    protocol: tcp
    destination_port: "{{ firewall_ssh_port }}"
    jump: DROP
  when: firewall_lock_ipv6 | bool
  notify: Persist iptables

# --- Private admin ports (Coolify 8000/6001/6002, Backrest 9898) ---
- name: Remove stale INPUT ACCEPT rules for retired ports
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_port: "{{ item }}"
    jump: ACCEPT
    state: absent
  loop: "{{ firewall_stale_input_ports }}"
  notify: Persist iptables

- name: Allow private host ports from trusted IPv4 sources
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_port: "{{ item[0] }}"
    source: "{{ item[1] }}"
    jump: ACCEPT
  loop: "{{ firewall_private_host_ports | product(firewall_private_trusted_v4) | list }}"
  notify: Persist iptables

- name: Drop private host ports from everyone else (IPv4)
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_port: "{{ item }}"
    jump: DROP
  loop: "{{ firewall_private_host_ports }}"
  notify: Persist iptables

- name: Allow private host ports from trusted IPv6 sources
  ansible.builtin.iptables:
    chain: INPUT
    ip_version: ipv6
    protocol: tcp
    destination_port: "{{ item[0] }}"
    source: "{{ item[1] }}"
    jump: ACCEPT
  loop: "{{ firewall_private_host_ports | product(firewall_private_trusted_v6) | list }}"
  notify: Persist iptables

- name: Drop private host ports from everyone else (IPv6)
  ansible.builtin.iptables:
    chain: INPUT
    ip_version: ipv6
    protocol: tcp
    destination_port: "{{ item }}"
    jump: DROP
  loop: "{{ firewall_private_host_ports }}"
  notify: Persist iptables

# Docker-published ports never traverse INPUT (DNAT -> FORWARD), so they are filtered in
# DOCKER-USER, which Docker creates but never flushes. Match on the ORIGINAL destination port
# (conntrack) so the container-side port and container IP do not matter. The iptables module
# cannot express --ctorigdstport, so rules are managed with an idempotent check (-C) then add.
# Trusted RETURNs are INSERTED at the top and DROPs APPENDED, so order stays correct even if
# the trusted list later grows. RETURN (not ACCEPT) hands traffic back to Docker's own rules.
- name: Ensure DOCKER-USER exists
  ansible.builtin.shell: "{{ item }} -n -L DOCKER-USER >/dev/null 2>&1 || {{ item }} -N DOCKER-USER"
  loop: [iptables, ip6tables]
  changed_when: false

- name: Return trusted sources for private Docker ports to Docker's rules
  ansible.builtin.shell: >-
    {{ item.0.cmd }} -C DOCKER-USER {{ spec }} 2>/dev/null && echo present ||
    {{ item.0.cmd }} -I DOCKER-USER 1 {{ spec }}
  vars:
    spec: >-
      -s {{ item.1[1] }} -p tcp -m conntrack --ctdir ORIGINAL
      --ctorigdstport {{ item.1[0] }} -j RETURN
  loop: >-
    {{ [{'cmd': 'iptables', 'p': firewall_private_docker_ports | product(firewall_private_trusted_v4) | list},
        {'cmd': 'ip6tables', 'p': firewall_private_docker_ports | product(firewall_private_trusted_v6) | list}]
       | subelements('p') }}
  register: firewall_du_return
  changed_when: "'present' not in firewall_du_return.stdout"
  notify: Persist iptables

- name: Drop private Docker ports from everyone else
  ansible.builtin.shell: >-
    {{ item[0] }} -C DOCKER-USER {{ spec }} 2>/dev/null && echo present ||
    {{ item[0] }} -A DOCKER-USER {{ spec }}
  vars:
    spec: "-p tcp -m conntrack --ctdir ORIGINAL --ctorigdstport {{ item[1] }} -j DROP"
  loop: "{{ ['iptables', 'ip6tables'] | product(firewall_private_docker_ports) | list }}"
  register: firewall_du_drop
  changed_when: "'present' not in firewall_du_drop.stdout"
  notify: Persist iptables

- name: Confirm we still have a working connection after the firewall changes
  ansible.builtin.ping:
