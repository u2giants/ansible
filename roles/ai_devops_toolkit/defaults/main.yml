---
ai_devops_toolkit_home: "/home/{{ managed_user }}"
ai_devops_toolkit_group: "{{ managed_user }}"
ai_devops_toolkit_checkout_owner: root
ai_devops_toolkit_checkout_group: "{{ managed_user }}"
ai_devops_toolkit_runtime_become: false
ai_devops_toolkit_state_dir: "{{ ai_devops_toolkit_home }}/.local/state/ai-devops/toolkit-releases"
ai_devops_toolkit_completion_marker: "{{ ai_devops_toolkit_state_dir }}/{{ ai_devops_toolkit_version }}.installed"
ai_devops_toolkit_verify_memory_schedule: true
ai_devops_toolkit_rewrite_predecessors: []
ai_devops_toolkit_upgrade_predecessors: []
# Vault-locked 1Password service-account token for the managed user's reviewer
# keys (Muse, StepFun, DeepSeek, GLM/OpenCode). CI loads it from
# op://vibe_coding/yw6o7cwwqn5n6zqliddu5d3w4m/OP_SERVICE_ACCOUNT_TOKEN into
# AI_DEVOPS_OP_SA_TOKEN; it is only ever written to the 0600 token file (no_log).
# Empty fails the role unless ai_devops_toolkit_require_token=false (tests only),
# so a token-less run can never mark a release installed without reviewer keys. Rotate by updating the 1Password item and re-dispatching the toolkit tag.
ai_devops_toolkit_op_token: "{{ lookup('ansible.builtin.env', 'AI_DEVOPS_OP_SA_TOKEN') | default('', true) }}"
ai_devops_toolkit_op_token_file: "{{ ai_devops_toolkit_home }}/.config/ai-devops/op-service-account"
ai_devops_toolkit_require_token: true
# ai-devops' own protected installer (update.sh + ai-task-gates) writes this
# receipt after a reviewed, verified install (issue #17).
ai_devops_toolkit_install_receipt: "{{ ai_devops_toolkit_home }}/.local/state/ai-devops/task-gates/install-completions/last.json"
