---
- name: Inspect the shared workspace parent
  ansible.builtin.stat:
    path: "{{ ai_devops_toolkit_path | dirname }}"
  register: ai_devops_toolkit_workspace

- name: Refuse an absent or differently owned shared workspace
  ansible.builtin.assert:
    that:
      - ai_devops_toolkit_workspace.stat.exists
      - ai_devops_toolkit_workspace.stat.isdir
      - ai_devops_toolkit_workspace.stat.pw_name == managed_user
    fail_msg: >-
      The shared workspace parent is absent or is not owned by {{ managed_user }}.
      Refusing to change ownership across sibling application checkouts.

- name: Own the AI DevOps release-state directory
  ansible.builtin.file:
    path: "{{ ai_devops_toolkit_state_dir }}"
    state: directory
    owner: "{{ managed_user }}"
    group: "{{ ai_devops_toolkit_group }}"
    mode: "0700"

- name: Read managed-user Git safe directories
  ansible.builtin.command:
    argv:
      - git
      - config
      - --global
      - --get-all
      - safe.directory
  become: "{{ ai_devops_toolkit_runtime_become }}"
  become_user: "{{ managed_user }}"
  environment:
    HOME: "{{ ai_devops_toolkit_home }}"
  register: ai_devops_toolkit_safe_directories
  changed_when: false
  failed_when: ai_devops_toolkit_safe_directories.rc not in [0, 1]
  check_mode: false

- name: Trust the exact governed checkout for managed-user reads
  ansible.builtin.command:
    argv:
      - git
      - config
      - --global
      - --add
      - safe.directory
      - "{{ ai_devops_toolkit_path }}"
  become: "{{ ai_devops_toolkit_runtime_become }}"
  become_user: "{{ managed_user }}"
  environment:
    HOME: "{{ ai_devops_toolkit_home }}"
  when: ai_devops_toolkit_path not in ai_devops_toolkit_safe_directories.stdout_lines

- name: Inspect the AI DevOps checkout
  ansible.builtin.stat:
    path: "{{ ai_devops_toolkit_path }}"
  register: ai_devops_toolkit_checkout

- name: Refuse an AI DevOps checkout owned by another account
  ansible.builtin.assert:
    that:
      - ai_devops_toolkit_checkout.stat.pw_name in [managed_user, ai_devops_toolkit_checkout_owner, 'root']
      - ai_devops_toolkit_checkout.stat.gr_name in [ai_devops_toolkit_group, ai_devops_toolkit_checkout_group]
    fail_msg: >-
      {{ ai_devops_toolkit_path }} is not owned by either the managed account or
      the governed checkout owner. Refusing to rewrite or install through an
      ambiguously owned checkout.
  when: ai_devops_toolkit_checkout.stat.exists

- name: Choose privilege for checkout transitions
  ansible.builtin.set_fact:
    # Root is needed while either the declared or the current owner is not the
    # managed user, so an owner migration (root:ai -> ai:ai, issue #17) can
    # move, clone and chown entries it does not yet own.
    ai_devops_toolkit_checkout_become: >-
      {{ ai_devops_toolkit_checkout_owner != managed_user
         or (ai_devops_toolkit_checkout.stat.exists
             and ai_devops_toolkit_checkout.stat.pw_name != managed_user) }}

- name: Inspect the pinned release completion marker
  ansible.builtin.stat:
    path: "{{ ai_devops_toolkit_completion_marker }}"
  register: ai_devops_toolkit_completion

- name: Read the revision recorded in the completion marker
  ansible.builtin.slurp:
    src: "{{ ai_devops_toolkit_completion_marker }}"
  register: ai_devops_toolkit_completion_content
  when: ai_devops_toolkit_completion.stat.exists

- name: Read the installed AI DevOps revision
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ ai_devops_toolkit_path }}"
      - rev-parse
      - HEAD
  become: "{{ ai_devops_toolkit_runtime_become }}"
  become_user: "{{ managed_user }}"
  environment:
    HOME: "{{ ai_devops_toolkit_home }}"
  register: ai_devops_toolkit_installed_revision
  changed_when: false
  check_mode: false
  when: ai_devops_toolkit_checkout.stat.exists

- name: Verify the existing AI DevOps checkout is clean
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ ai_devops_toolkit_path }}"
      - status
      - --porcelain
      - --untracked-files=all
  become: "{{ ai_devops_toolkit_runtime_become }}"
  become_user: "{{ managed_user }}"
  environment:
    HOME: "{{ ai_devops_toolkit_home }}"
    # A read-only check: never refresh the index, so an ai-owned checkout
    # does not gain a rewritten .git/index on every run (issue #17).
    GIT_OPTIONAL_LOCKS: "0"
  register: ai_devops_toolkit_status
  changed_when: false
  check_mode: false
  when: ai_devops_toolkit_checkout.stat.exists

- name: Refuse to overwrite uncommitted AI DevOps work
  ansible.builtin.assert:
    that:
      - ai_devops_toolkit_status.stdout | length == 0
    fail_msg: >-
      {{ ai_devops_toolkit_path }} contains uncommitted work. Preserve and reconcile it
      before deploying the managed toolkit.
  when: ai_devops_toolkit_checkout.stat.exists

- name: Read the installed AI DevOps branch
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ ai_devops_toolkit_path }}"
      - branch
      - --show-current
  become: "{{ ai_devops_toolkit_runtime_become }}"
  become_user: "{{ managed_user }}"
  environment:
    HOME: "{{ ai_devops_toolkit_home }}"
  register: ai_devops_toolkit_installed_branch
  changed_when: false
  check_mode: false
  when: ai_devops_toolkit_checkout.stat.exists

- name: Test whether the installed revision is on the real ai-devops main
  # A throwaway treeless fetch keeps the governed checkout untouched and does
  # not depend on which remote commits the checkout has already fetched.
  ansible.builtin.command:
    argv:
      - sh
      - -c
      - |
        set -eu
        scratch="$(mktemp -d)"
        trap 'rm -rf "$scratch"' EXIT
        git init -q --bare "$scratch"
        git -C "$scratch" fetch -q --filter=tree:0 "$1" +refs/heads/main:refs/heads/main || exit 3
        git -C "$scratch" merge-base --is-ancestor "$2" refs/heads/main
      - sh
      - "{{ ai_devops_toolkit_repo_url }}"
      - "{{ ai_devops_toolkit_installed_revision.stdout }}"
  become: "{{ ai_devops_toolkit_runtime_become }}"
  become_user: "{{ managed_user }}"
  environment:
    HOME: "{{ ai_devops_toolkit_home }}"
  register: ai_devops_toolkit_on_remote_main
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - ai_devops_toolkit_checkout.stat.exists
    - ai_devops_toolkit_installed_revision.stdout != ai_devops_toolkit_version

- name: Test whether the installed revision descends from the pin
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ ai_devops_toolkit_path }}"
      - merge-base
      - --is-ancestor
      - "{{ ai_devops_toolkit_version }}"
      - HEAD
  become: "{{ ai_devops_toolkit_runtime_become }}"
  become_user: "{{ managed_user }}"
  environment:
    HOME: "{{ ai_devops_toolkit_home }}"
  register: ai_devops_toolkit_pin_ancestry
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - ai_devops_toolkit_checkout.stat.exists
    - ai_devops_toolkit_installed_revision.stdout != ai_devops_toolkit_version

- name: Classify the installed AI DevOps revision
  ansible.builtin.set_fact:
    # ai-devops advances its own checkout (protected update.sh). A clean main
    # checkout whose HEAD is on the real remote main (ls-remote, not the local
    # tracking ref) and descends from the pin is accepted as-is: installer
    # only, never a Git move. Anything else still needs the pin or a declared
    # predecessor below.
    ai_devops_toolkit_self_advanced: >-
      {{ ai_devops_toolkit_checkout.stat.exists
         and ai_devops_toolkit_installed_revision.stdout != ai_devops_toolkit_version
         and ai_devops_toolkit_installed_branch.stdout == 'main'
         and (ai_devops_toolkit_on_remote_main.rc | default(1)) == 0
         and (ai_devops_toolkit_pin_ancestry.rc | default(1)) == 0 }}

- name: Classify the required AI DevOps transition
  ansible.builtin.set_fact:
    ai_devops_toolkit_expected_revision: >-
      {{ ai_devops_toolkit_installed_revision.stdout if ai_devops_toolkit_self_advanced
         else ai_devops_toolkit_version }}

- name: Classify the required AI DevOps install and Git move
  ansible.builtin.set_fact:
    # A marker naming an older revision means the checkout self-advanced since
    # the last install, so the installer runs again for the live revision.
    ai_devops_toolkit_requires_install: >-
      {{ (not ai_devops_toolkit_checkout.stat.exists)
         or (ai_devops_toolkit_installed_revision.stdout != ai_devops_toolkit_version
             and not ai_devops_toolkit_self_advanced)
         or (not ai_devops_toolkit_completion.stat.exists)
         or ('revision=' ~ (ai_devops_toolkit_expected_revision | trim))
            not in ((ai_devops_toolkit_completion_content.content | default('')) | b64decode).splitlines() }}
    # The toolkit's installed-checkout guard (ai-devops #1836) refuses any HEAD
    # move by anything but its own installer, so never touch Git when the clean
    # checkout is already the pin, or a self-advanced descendant, on main.
    ai_devops_toolkit_requires_checkout_move: >-
      {{ (not ai_devops_toolkit_checkout.stat.exists)
         or (ai_devops_toolkit_installed_revision.stdout != ai_devops_toolkit_version
             and not ai_devops_toolkit_self_advanced)
         or (ai_devops_toolkit_installed_branch.stdout != 'main') }}
    ai_devops_toolkit_requires_history_cutover: >-
      {{ ai_devops_toolkit_checkout.stat.exists
         and ai_devops_toolkit_installed_revision.stdout in ai_devops_toolkit_rewrite_predecessors }}
    ai_devops_toolkit_requires_in_place_upgrade: >-
      {{ ai_devops_toolkit_checkout.stat.exists
         and ai_devops_toolkit_installed_revision.stdout in ai_devops_toolkit_upgrade_predecessors }}

- name: Refuse an undeclared AI DevOps history transition
  ansible.builtin.assert:
    that:
      - not ai_devops_toolkit_checkout.stat.exists
        or ai_devops_toolkit_installed_revision.stdout == ai_devops_toolkit_version
        or ai_devops_toolkit_self_advanced
        or ai_devops_toolkit_requires_history_cutover
        or ai_devops_toolkit_requires_in_place_upgrade
    fail_msg: >-
      Installed AI DevOps revision {{ ai_devops_toolkit_installed_revision.stdout | default("none") }} is neither
      the pinned release, a clean main descendant of it on the real remote main
      (remote check rc={{ ai_devops_toolkit_on_remote_main.rc | default('n/a') }}: 1 = not on
      remote main, 3 = remote unreachable; pin ancestry rc={{ ai_devops_toolkit_pin_ancestry.rc | default('n/a') }}),
      an approved rewrite predecessor, nor an approved in-place upgrade predecessor. Refusing to replace it.

- name: Inspect the fixed pre-rewrite backup path
  ansible.builtin.stat:
    path: "{{ ai_devops_toolkit_backup_path }}"
  register: ai_devops_toolkit_backup
  when: ai_devops_toolkit_requires_history_cutover

- name: Refuse to overwrite a prior AI DevOps history backup
  ansible.builtin.assert:
    that:
      - not ai_devops_toolkit_backup.stat.exists
    fail_msg: >-
      Backup path {{ ai_devops_toolkit_backup_path }} already exists. Refusing to overwrite it.
  when: ai_devops_toolkit_requires_history_cutover

- name: Preserve the pre-rewrite AI DevOps checkout
  ansible.builtin.command:
    argv:
      - mv
      - "{{ ai_devops_toolkit_path }}"
      - "{{ ai_devops_toolkit_backup_path }}"
    removes: "{{ ai_devops_toolkit_path }}"
    creates: "{{ ai_devops_toolkit_backup_path }}"
  become: "{{ ai_devops_toolkit_checkout_become | bool }}"
  when: ai_devops_toolkit_requires_history_cutover

- name: Report the planned history cutover during check mode
  ansible.builtin.debug:
    msg: >-
      Check mode: the preserved checkout will move to {{ ai_devops_toolkit_backup_path }},
      then the pinned release will be cloned to {{ ai_devops_toolkit_path }}.
  when:
    - ansible_check_mode
    - ai_devops_toolkit_requires_history_cutover

- name: Clone or update the pinned AI DevOps release
  ansible.builtin.git:
    repo: "{{ ai_devops_toolkit_repo_url }}"
    dest: "{{ ai_devops_toolkit_path }}"
    version: "{{ ai_devops_toolkit_version }}"
    update: true
    force: false
  become: "{{ ai_devops_toolkit_checkout_become | bool }}"
  environment:
    HOME: "{{ ai_devops_toolkit_home }}"
  when:
    - ai_devops_toolkit_requires_install
    - ai_devops_toolkit_requires_checkout_move
    - not (ansible_check_mode and ai_devops_toolkit_requires_history_cutover)

- name: Attach the pinned AI DevOps release to main
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ ai_devops_toolkit_path }}"
      - checkout
      - -B
      - main
      - "{{ ai_devops_toolkit_version }}"
  become: "{{ ai_devops_toolkit_checkout_become | bool }}"
  environment:
    HOME: "{{ ai_devops_toolkit_home }}"
  when:
    - ai_devops_toolkit_requires_install
    - ai_devops_toolkit_requires_checkout_move
    - not ansible_check_mode

- name: Report the planned governed-checkout ownership boundary during check mode
  ansible.builtin.debug:
    msg: >-
      The governed checkout top level would converge from
      {{ ai_devops_toolkit_checkout.stat.pw_name }}:{{ ai_devops_toolkit_checkout.stat.gr_name }}
      mode {{ ai_devops_toolkit_checkout.stat.mode }} to
      {{ ai_devops_toolkit_checkout_owner }}:{{ ai_devops_toolkit_checkout_group }}
      mode 0750; recursive enforcement will not follow symlinks.
  changed_when: >-
    ai_devops_toolkit_checkout.stat.pw_name != ai_devops_toolkit_checkout_owner
    or ai_devops_toolkit_checkout.stat.gr_name != ai_devops_toolkit_checkout_group
    or ai_devops_toolkit_checkout.stat.mode != '0750'
  when:
    - ansible_check_mode
    - ai_devops_toolkit_checkout.stat.exists

- name: Find governed-checkout ownership or mode drift without following symlinks
  ansible.builtin.command:
    argv:
      - find
      - -P
      - "{{ ai_devops_toolkit_path }}"
      - -xdev
      - "!"
      - -type
      - l
      - "("
      - "!"
      - -user
      - "{{ ai_devops_toolkit_checkout_owner }}"
      - -o
      - "!"
      - -group
      - "{{ ai_devops_toolkit_checkout_group }}"
      - -o
      - "("
      - -type
      - d
      - "!"
      - -perm
      - "0750"
      - ")"
      - -o
      - "("
      - -type
      - f
      - "!"
      - -perm
      - "0640"
      - "!"
      - -perm
      - "0750"
      - ")"
      - -o
      - "("
      - "!"
      - -type
      - d
      - "!"
      - -type
      - f
      - ")"
      - ")"
      - -print
      - -quit
  become: "{{ ai_devops_toolkit_checkout_become | bool }}"
  register: ai_devops_toolkit_ownership_drift
  changed_when: false
  when: not ansible_check_mode

- name: Converge the governed checkout ownership and modes
  ansible.builtin.file:
    path: "{{ ai_devops_toolkit_path }}"
    state: directory
    owner: "{{ ai_devops_toolkit_checkout_owner }}"
    group: "{{ ai_devops_toolkit_checkout_group }}"
    mode: "u=rwX,g=rX,o="
    recurse: true
    follow: false
  become: "{{ ai_devops_toolkit_checkout_become | bool }}"
  when:
    - not ansible_check_mode
    - ai_devops_toolkit_ownership_drift.stdout | default('') | length > 0

- name: Read ai-devops' own verified install receipt
  ansible.builtin.slurp:
    src: "{{ ai_devops_toolkit_install_receipt }}"
  register: ai_devops_toolkit_receipt
  failed_when: false
  when:
    - ai_devops_toolkit_requires_install
    - ai_devops_toolkit_self_advanced

- name: Accept a self-advanced release the toolkit installed and verified itself
  ansible.builtin.set_fact:
    # ai-devops' installer refuses to run without its own reviewed install
    # authority, so a self-advanced checkout its protected update.sh already
    # installed and verified is recorded, never reinstalled (issue #17).
    ai_devops_toolkit_installed_by_toolkit: >-
      {{ ai_devops_toolkit_self_advanced
         and (ai_devops_toolkit_receipt.content is defined)
         and ((ai_devops_toolkit_receipt.content | b64decode | from_json).target_head | default('')) == (ai_devops_toolkit_expected_revision | trim)
         and ((ai_devops_toolkit_receipt.content | b64decode | from_json).installed_checkout | default('')) == ai_devops_toolkit_path }}
  when: ai_devops_toolkit_requires_install

- name: Require the reviewer-key token for a real toolkit install
  ansible.builtin.assert:
    that:
      - ai_devops_toolkit_op_token | length > 0
    fail_msg: >-
      AI_DEVOPS_OP_SA_TOKEN is empty. Dispatch apply.yml with tags=ai_devops_toolkit
      (it loads the token from 1Password), or export it from op read before a manual run.
  when:
    - ai_devops_toolkit_require_token | bool
    - ai_devops_toolkit_requires_install

- name: Own the AI DevOps secrets config directory
  ansible.builtin.file:
    path: "{{ ai_devops_toolkit_op_token_file | dirname }}"
    state: directory
    owner: "{{ managed_user }}"
    group: "{{ ai_devops_toolkit_group }}"
    mode: "0700"
  when: ai_devops_toolkit_op_token | length > 0

- name: Restore the vault-locked 1Password service-account token
  ansible.builtin.copy:
    dest: "{{ ai_devops_toolkit_op_token_file }}"
    content: "{{ ai_devops_toolkit_op_token | trim }}\n"
    owner: "{{ managed_user }}"
    group: "{{ ai_devops_toolkit_group }}"
    mode: "0600"
  no_log: true
  when: ai_devops_toolkit_op_token | length > 0

- name: Choose the installer secrets mode
  ansible.builtin.set_fact:
    ai_devops_toolkit_secrets_flag: >-
      {{ '--require-secrets' if ai_devops_toolkit_op_token | length > 0 else '--skip-secrets' }}

- name: Install the pinned AI DevOps release
  ansible.builtin.command:
    argv:
      - "{{ ai_devops_toolkit_path }}/install.sh"
      - "{{ ai_devops_toolkit_secrets_flag }}"
  become: "{{ ai_devops_toolkit_runtime_become }}"
  become_user: "{{ managed_user }}"
  environment:
    HOME: "{{ ai_devops_toolkit_home }}"
  when:
    - ai_devops_toolkit_requires_install
    - not (ai_devops_toolkit_installed_by_toolkit | default(false) | bool)
    - not ansible_check_mode

- name: Adopt reviewed Claude and Codex globals
  ansible.builtin.command:
    argv:
      - "{{ ai_devops_toolkit_path }}/bin/ai-install-skills"
      - --adopt-globals
  become: "{{ ai_devops_toolkit_runtime_become }}"
  become_user: "{{ managed_user }}"
  environment:
    HOME: "{{ ai_devops_toolkit_home }}"
  when:
    - ai_devops_toolkit_requires_install
    - not (ai_devops_toolkit_installed_by_toolkit | default(false) | bool)
    - not ansible_check_mode

- name: Inspect the governed checkout ownership boundary
  ansible.builtin.stat:
    path: "{{ ai_devops_toolkit_path }}"
  register: ai_devops_toolkit_governed_checkout

- name: Verify the governed checkout ownership boundary
  ansible.builtin.assert:
    that:
      - ai_devops_toolkit_governed_checkout.stat.pw_name == ai_devops_toolkit_checkout_owner
      - ai_devops_toolkit_governed_checkout.stat.gr_name == ai_devops_toolkit_checkout_group
      - ai_devops_toolkit_governed_checkout.stat.mode == '0750'
    fail_msg: >-
      The governed checkout is not owned and protected exactly as declared.
      Refusing to certify a mutable production runtime checkout.
  when:
    - ai_devops_toolkit_governed_checkout.stat.exists
    - not ansible_check_mode

- name: Verify the installed AI DevOps revision
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ ai_devops_toolkit_path }}"
      - rev-parse
      - HEAD
  become: "{{ ai_devops_toolkit_runtime_become }}"
  become_user: "{{ managed_user }}"
  environment:
    HOME: "{{ ai_devops_toolkit_home }}"
  register: ai_devops_toolkit_verified_revision
  changed_when: false
  check_mode: false
  failed_when: ai_devops_toolkit_verified_revision.stdout != ai_devops_toolkit_expected_revision | trim
  when: not (ansible_check_mode and ai_devops_toolkit_requires_install)

- name: Verify the installed AI DevOps branch
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ ai_devops_toolkit_path }}"
      - branch
      - --show-current
  become: "{{ ai_devops_toolkit_runtime_become }}"
  become_user: "{{ managed_user }}"
  environment:
    HOME: "{{ ai_devops_toolkit_home }}"
  register: ai_devops_toolkit_verified_branch
  changed_when: false
  check_mode: false
  failed_when: ai_devops_toolkit_verified_branch.stdout != 'main'
  when: not (ansible_check_mode and ai_devops_toolkit_requires_install)

- name: Run the AI DevOps health check
  ansible.builtin.command:
    argv:
      - "{{ ai_devops_toolkit_path }}/bin/ai-devops"
      - doctor
  become: "{{ ai_devops_toolkit_runtime_become }}"
  become_user: "{{ managed_user }}"
  environment:
    HOME: "{{ ai_devops_toolkit_home }}"
  register: ai_devops_toolkit_doctor
  changed_when: false
  when: not ansible_check_mode

- name: Verify the toolkit did not recreate the retired memory schedule
  ansible.builtin.command:
    argv:
      - crontab
      - -u
      - "{{ managed_user }}"
      - -l
  register: ai_devops_toolkit_crontab
  changed_when: false
  failed_when: >-
    ai_devops_toolkit_crontab.rc not in [0, 1]
    or (ai_devops_toolkit_path ~ '/bin/ai-memory-sync') in ai_devops_toolkit_crontab.stdout
  when:
    - not ansible_check_mode
    - ai_devops_toolkit_verify_memory_schedule | bool

- name: Record successful installation of the pinned AI DevOps release
  ansible.builtin.copy:
    dest: "{{ ai_devops_toolkit_completion_marker }}"
    owner: "{{ managed_user }}"
    group: "{{ ai_devops_toolkit_group }}"
    mode: "0600"
    content: |
      revision={{ ai_devops_toolkit_expected_revision | trim }}
      pin={{ ai_devops_toolkit_version }}
      {% if ai_devops_toolkit_installed_by_toolkit | default(false) | bool %}
      installer=ai-devops update.sh (verified receipt {{ ai_devops_toolkit_install_receipt }})
      {% else %}
      installer=install.sh {{ ai_devops_toolkit_secrets_flag }}
      globals=ai-install-skills --adopt-globals
      {% endif %}
      doctor=passed
  when:
    - ai_devops_toolkit_requires_install
    - not ansible_check_mode
